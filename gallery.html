		<!-- Gallery Script: photos and captions come from assets/js/gallery-data.js -->
		<script src="assets/js/gallery-data.js"></script>
		<script>
			// Tile sizes, repeated in order across all photos
			const GALLERY_LAYOUT = [
				'w-3 h-2', 'w-3 h-3', 'h-2', 'w-2 h-2', 'w-2 h-1', 'w-1 h-3',
				'w-2 h-3', 'w-3 h-2', 'w-1 h-3', 'w-3 h-2', 'h-4', 'w-1 h-2',
				'w-1 h-3', 'w-2 h-3', 'w-2 h-2', 'w-5 h-1', 'w-1 h-1'
			];

			function buildCaption(photo) {
				if (!photo.location && !photo.year) return null;

				const caption = document.createElement('div');
				caption.className = 'caption';

				if (photo.location) {
					const locationEl = document.createElement('span');
					locationEl.className = 'location icon solid fa-map-marker-alt';
					locationEl.textContent = photo.location;
					caption.appendChild(locationEl);
				}
				if (photo.year) {
					const yearEl = document.createElement('span');
					yearEl.className = 'year';
					yearEl.textContent = photo.year;
					caption.appendChild(yearEl);
				}
				return caption;
			}

			const gallery = document.getElementById('gallery');
			GALLERY_PHOTOS.forEach(function(photo, index) {
				const container = document.createElement('div');
				container.className = 'gallery-container ' + GALLERY_LAYOUT[index % GALLERY_LAYOUT.length];

				const item = document.createElement('div');
				item.className = 'gallery-item';

				const image = document.createElement('div');
				image.className = 'image';

				const img = document.createElement('img');
				img.src = 'images/' + photo.file;
				img.alt = photo.alt || '';
				img.loading = 'lazy';

				image.appendChild(img);
				item.appendChild(image);
				const caption = buildCaption(photo);
				if (caption) item.appendChild(caption);
				container.appendChild(item);
				gallery.appendChild(container);
			});
		</script>

		<!-- Language Switching Script -->
		<script>
			function changeLanguage() {
				const languageSelect = document.getElementById('language-select');
				const selectedLanguage = languageSelect.value;
				
				// Get all elements with data attributes for different languages
				const elements = document.querySelectorAll('[data-en], [data-fr], [data-vi]');
				
				elements.forEach(element => {
					const text = element.getAttribute(`data-${selectedLanguage}`);
					if (text) {
						// Always use innerHTML to preserve HTML tags like <strong>, <em>, <code>, <a>
						element.innerHTML = text;
					}
				});
				
				// Store the selected language in localStorage
				localStorage.setItem('selectedLanguage', selectedLanguage);
			}
			
			// Load saved language preference on page load
			document.addEventListener('DOMContentLoaded', function() {
				const savedLanguage = localStorage.getItem('selectedLanguage');
				if (savedLanguage) {
					document.getElementById('language-select').value = savedLanguage;
					changeLanguage();
				}
			});
		</script>
